[workspace]
resolver = "2"
members = ["crates/dj-core", "crates/dj-online", "crates/dj-devbridge", "src-tauri"]
default-members = ["crates/dj-core"]

[workspace.package]
version = "1.8.1"
edition = "2021"
license = "MIT"
authors = ["DeeJayKyle"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, faster Windows build: whole-program optimisation, one codegen unit.
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
