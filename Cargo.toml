[workspace]
resolver = "2"
members = ["crates/dj-core", "crates/dj-online", "crates/dj-devbridge", "src-tauri"]
default-members = ["crates/dj-core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["DeeJayKyle"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
