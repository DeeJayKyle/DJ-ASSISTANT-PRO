[package]
name = "dj-core"
description = "Local, read-only music library core for DJ Assistant (no network access)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
lofty = "0.25"
walkdir = "2.5"
blake3 = "1.8"
thiserror = "2"
crossbeam-channel = "0.5"
unicode-normalization = "0.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "pcm", "vorbis", "isomp4", "ogg", "wav", "aiff"] }
rustfft = "6"
ebur128 = "0.1"
rusty-chromaprint = "0.3"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3"
