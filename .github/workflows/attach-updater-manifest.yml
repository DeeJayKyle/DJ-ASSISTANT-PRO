name: Attach updater manifest

# Attaches a latest.json (signed elsewhere with the updater key) to an existing
# release. Used when the installer was signed outside CI. The signature inside
# is public data; no secrets are involved.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
      manifest_b64:
        description: "latest.json, base64-encoded"
        required: true

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decode and validate
        env:
          MANIFEST_B64: ${{ inputs.manifest_b64 }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "$MANIFEST_B64" | base64 -d > latest.json
          python3 - <<'PY'
          import json, os
          m = json.load(open("latest.json"))
          tag = os.environ["TAG"]
          assert "v" + m["version"] == tag, f"version {m['version']} does not match {tag}"
          p = m["platforms"]["windows-x86_64"]
          assert p["signature"] and p["url"].startswith("https://github.com/"), "bad platform entry"
          assert f"/releases/download/{tag}/" in p["url"], "url must point at this release"
          print("manifest ok")
          PY
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
