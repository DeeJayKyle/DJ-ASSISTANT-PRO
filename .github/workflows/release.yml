name: Release

# Manually triggered. Builds and tests on Windows, then publishes a GitHub
# release with the installer and its SHA-256 checksum. The release is only
# created if every check and test passes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p dj-core --locked
      - run: python scripts/check-licenses.py
      - name: Check version matches tag
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ inputs.tag }}") { throw "tauri.conf.json version v$v does not match tag ${{ inputs.tag }}" }
      - name: Build installer
        run: npx tauri build --ci
      - name: Collect release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" release/
          Push-Location release
          Get-ChildItem *.exe | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Verify checksums before publishing
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        run: |
          flags=""
          if [ "$PRE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DJ Assistant $TAG" --notes-file docs/RELEASE_NOTES.md $flags
