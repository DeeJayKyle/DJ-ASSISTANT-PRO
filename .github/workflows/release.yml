name: Release

# Manually triggered. Builds and tests on Windows, then publishes a GitHub
# release with the installer and its SHA-256 checksum. The release is only
# created if every check and test passes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p dj-core --locked
      - run: cargo test -p dj-online --locked
      - run: python scripts/check-licenses.py
      - run: ./scripts/check-read-only.sh
        shell: bash
      - name: Check version matches tag
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ inputs.tag }}") { throw "tauri.conf.json version v$v does not match tag ${{ inputs.tag }}" }
      - name: Build installer (signed for auto-update when the signing key secret is configured)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --ci
          } else {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY secret not set - building without updater signature. Sign and upload latest.json manually."
            npx tauri build --ci --config src-tauri/tauri.ci.conf.json
          }
      - name: Collect release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          # GitHub replaces spaces in asset names, so publish a space-free name
          # that matches SHA256SUMS.txt exactly.
          Get-ChildItem "target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName (Join-Path release ($_.Name -replace ' ', '-'))
          }
          Get-ChildItem "target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName (Join-Path release ($_.Name -replace ' ', '-'))
          }
          Push-Location release
          Get-ChildItem *.exe | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          # Updater manifest (only when the installer was signed)
          $sig = Get-ChildItem *.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            $exe = $sig.Name -replace '\.sig$', ''
            $version = (Get-Content ../src-tauri/tauri.conf.json | ConvertFrom-Json).version
            $manifest = @{
              version = $version
              notes = (Get-Content ../docs/RELEASE_NOTES.md -Raw)
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{ "windows-x86_64" = @{
                signature = (Get-Content $sig.Name -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$exe"
              } }
            }
            $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM latest.json
            Get-Content latest.json
          }
          Pop-Location
      - name: Verify checksums before publishing
        shell: pwsh
        working-directory: release
        run: |
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $h, $name = $line -split '  ', 2
            if ((Get-FileHash $name -Algorithm SHA256).Hash.ToLower() -ne $h) { throw "checksum mismatch for $name" }
          }
          Get-ChildItem
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        run: |
          $files = Get-ChildItem release | ForEach-Object { $_.FullName }
          $flags = @()
          if ($env:PRE -eq "true") { $flags += "--prerelease" } else { $flags += "--latest" }
          gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DJ Assistant $env:TAG" --notes-file docs/RELEASE_NOTES.md @flags
