name: Flutter (DJ Assistant 2.0)

# Analyses, tests and builds the Flutter rewrite in dj_assistant_flutter/.
on:
  push:
    paths: ["dj_assistant_flutter/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: dj_assistant_flutter

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build tools (some plugins build native code during tests)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev ninja-build clang cmake pkg-config
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable, cache: true }
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable, cache: true }
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Build the installer
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          ./installer/build.ps1 -Version $v -Out "installer-out/DJ-Assistant_${v}_x64-setup.exe"
      - name: Test the installer (update from 1.8.1, run, uninstall, fresh install)
        shell: pwsh
        run: ./installer/test-upgrade.ps1 -Setup "installer-out/DJ-Assistant_$($env:VERSION)_x64-setup.exe" -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: dj-assistant-2-windows-installer
          path: dj_assistant_flutter/installer-out/
