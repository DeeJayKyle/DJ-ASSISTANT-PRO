name: Flutter (DJ Assistant 2.0)

# Analyses, tests and builds the Flutter rewrite in dj_assistant_flutter/.
on:
  push:
    paths: ["dj_assistant_flutter/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: dj_assistant_flutter

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build tools (some plugins build native code during tests)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev ninja-build clang cmake pkg-config xvfb
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable, cache: true }
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      # test/screens also writes a screenshot of every page (3 sizes, dark
      # and light) for review; it fails on any overflow or layout error.
      - run: flutter test
        env:
          SCREENSHOTS: ${{ runner.temp }}/screenshots
      - name: Drive the real app (every page; split and play a song on Stems)
        working-directory: dj_assistant_flutter
        run: xvfb-run -a -s "-screen 0 1600x1000x24" flutter test integration_test -d linux --dart-define=SHOTS=${{ runner.temp }}/screenshots/app-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dj-assistant-2-screenshots
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable, cache: true }
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Drive the real app on Windows (every page; split an MP3 and play it on Stems)
        shell: pwsh
        run: |
          flutter test integration_test -d windows --dart-define=SHOTS="$env:RUNNER_TEMP\app-windows"
          if ($LASTEXITCODE -ne 0) { throw 'integration test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dj-assistant-2-windows-app-screenshots
          path: ${{ runner.temp }}/app-windows/
          if-no-files-found: ignore
      - name: The build ships ONNX Runtime 1.22 with DirectML (1.15 can't read the stems model)
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          foreach ($f in 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'DirectML.dll') {
            if (-not (Test-Path "$rel\$f")) { throw "missing $f" }
          }
          $v = (Get-Item "$rel\onnxruntime.dll").VersionInfo.ProductVersion
          Write-Host "onnxruntime.dll $v"
          if (-not $v.StartsWith('1.22')) { throw "onnxruntime.dll is $v, expected 1.22" }
      # Pro Stems AI with the real model, as the app runs it (the pack's URL and checksum).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stems-model
          key: htdemucs-e5e425c17683f163a472462eb5f5a4ffcd11c31858d57fbd0833b012d8b88077
      - name: Pro Stems AI model
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'stems-model'
          $m = Join-Path $d 'htdemucs_embedded.onnx'
          New-Item -ItemType Directory -Force $d | Out-Null
          if (-not (Test-Path $m)) {
            Invoke-WebRequest 'https://github.com/DeeJayKyle/DJ-ASSISTANT-PRO/releases/download/packs-1/htdemucs_embedded.onnx' -OutFile $m
          }
          $h = (Get-FileHash $m -Algorithm SHA256).Hash.ToLower()
          if ($h -ne 'e5e425c17683f163a472462eb5f5a4ffcd11c31858d57fbd0833b012d8b88077') { Remove-Item $m; throw "model checksum $h" }
          "DJ_AI_MODEL=$m" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Test Pro Stems AI with the built ONNX Runtime
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          # the app loads it from its own folder; the test points at the build
          $env:DJ_ORT_DLL = (Resolve-Path "$rel\onnxruntime.dll").Path
          flutter test test/ai_model_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'AI tests failed' }
      - name: Get Pro Stems AI as the app does (Settings → Packs → Get)
        shell: pwsh
        env:
          DJ_PACK_DOWNLOAD: "1"
        run: |
          flutter test test/pack_download_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'pack download failed' }
      - name: Build the installer
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          ./installer/build.ps1 -Version $v -Out "installer-out/DJ-Assistant_${v}_x64-setup.exe"
      - name: Test the installer (update from 1.8.1, run, uninstall, fresh install)
        shell: pwsh
        run: ./installer/test-upgrade.ps1 -Setup "installer-out/DJ-Assistant_$($env:VERSION)_x64-setup.exe" -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: dj-assistant-2-windows-installer
          path: dj_assistant_flutter/installer-out/
