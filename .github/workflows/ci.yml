name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows — checks, tests and installer build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install npm dependencies (locked)
        run: npm ci
      - name: Front-end typecheck
        run: npm run typecheck
      - name: Front-end unit tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Core tests (scanner, catalogue, search, crates, duplicates, analysis, v1 features)
        run: cargo test -p dj-core --locked
      - name: Online service parser tests
        run: cargo test -p dj-online --locked
      - name: Licence check
        run: python scripts/check-licenses.py
      - name: Read-only guard (no file-modifying APIs in shipped code)
        shell: bash
        run: ./scripts/check-read-only.sh
      - name: Build Windows installer (NSIS; updater signing happens in the release workflow)
        run: npx tauri build --ci --config src-tauri/tauri.ci.conf.json
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "installer not produced" }
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Append -Encoding ascii "target/release/bundle/nsis/SHA256SUMS.txt"
          }
          Get-Content "target/release/bundle/nsis/SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dj-assistant-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  linux-e2e:
    name: Linux — end-to-end UI test and no-network check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install strace
        run: sudo apt-get update -q && sudo apt-get install -y -q strace
      - name: Core tests
        run: cargo test -p dj-core --locked
      - name: No network access during scanning
        run: ./scripts/check-no-network.sh
      - name: End-to-end UI test (real UI + real backend + real files)
        run: npm run e2e
