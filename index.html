<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Assistant</title>
    <style>
      /* Painted before any script loads, so the window never flashes white. */
      html, body { margin: 0; background: #0c0f12; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(900px 500px at 50% 35%, rgba(79, 224, 166, 0.12), transparent 70%), #0c0f12; color: #e8eef0; font: 600 15px/1.4 Inter, "Segoe UI", system-ui, sans-serif; transition: opacity 420ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .mark { display: grid; justify-items: center; gap: 14px; animation: sp-in 600ms cubic-bezier(0.2, 0.9, 0.3, 1.35) both; }
      #splash svg { width: 84px; height: 84px; overflow: visible; }
      #splash .bar { fill: #4fe0a6; transform-box: fill-box; transform-origin: center; animation: sp-eq 900ms ease-in-out infinite; }
      #splash .bar:nth-child(2) { animation-delay: -150ms; } #splash .bar:nth-child(3) { animation-delay: -300ms; }
      #splash .bar:nth-child(4) { animation-delay: -450ms; } #splash .bar:nth-child(5) { animation-delay: -600ms; }
      #splash .name { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
      #splash .sub { color: #9aa6ae; font-weight: 500; font-size: 13px; animation: sp-fade 900ms 250ms both; }
      #splash .ring { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(79, 224, 166, 0.0); border-top-color: rgba(79, 224, 166, 0.55); animation: sp-spin 1.1s linear infinite; }
      @keyframes sp-in { from { opacity: 0; transform: scale(0.85) translateY(8px); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @keyframes sp-eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="DJ Assistant is starting">
      <div class="mark">
        <div style="position: relative; display: grid; place-items: center; width: 150px; height: 150px">
          <span class="ring"></span>
          <svg viewBox="0 0 50 40" aria-hidden="true">
            <rect class="bar" x="2" y="8" width="6" height="24" rx="3" />
            <rect class="bar" x="12" y="2" width="6" height="36" rx="3" />
            <rect class="bar" x="22" y="10" width="6" height="20" rx="3" />
            <rect class="bar" x="32" y="4" width="6" height="32" rx="3" />
            <rect class="bar" x="42" y="12" width="6" height="16" rx="3" />
          </svg>
        </div>
        <div class="name">DJ Assistant</div>
        <div class="sub">Getting your library ready…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
